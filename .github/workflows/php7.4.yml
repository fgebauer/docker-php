name: PHP7.4

on:
  workflow_dispatch:
  push:
    branches: [ 'develop' ]
    paths:
      - 'php-fpm/**'
      - 'php-fpm-nginx/**'
      - 'php-fpm-apache2/**'
  schedule:
    - cron: '15 9 * * 6'  # Run once a week on Saturday at 09:15 UTC

jobs:

  docker:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: 'amd64,arm64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push php-fpm:7.4
        uses: docker/build-push-action@v3
        with:
          context: php-fpm
          platforms: linux/amd64,linux/arm64
          build-args: |
            PHP_VERSION=7.4
          push: true
          tags: fgebauer/php-fpm:7.4

      - name: Build and push php-fpm-nginx:7.4
        uses: docker/build-push-action@v3
        with:
          context: php-fpm-nginx
          platforms: linux/amd64,linux/arm64
          build-args: |
            PHP_VERSION=7.4
          push: true
          tags: fgebauer/php-fpm-nginx:7.4

      - name: Build and push php-fpm-apache2:7.4
        uses: docker/build-push-action@v3
        with:
          context: php-fpm-apache2
          platforms: linux/amd64,linux/arm64
          build-args: |
            PHP_VERSION=7.4
          push: true
          tags: fgebauer/php-fpm-apache2:7.4
